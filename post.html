<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading… — Matt Hornsby</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
</head>
<body class="post-page">

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-title">Matt Hornsby</a>
      <nav class="site-nav">
        <a href="index.html" class="nav-link">Writing</a>
        <a href="about.html" class="nav-link">About</a>
      </nav>
    </div>
  </header>

  <div class="post-layout">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <a href="index.html" class="back-link">← All posts</a>
        <h3 class="sidebar-heading">More posts</h3>
        <nav id="sidebar-posts" class="sidebar-nav">
          <p class="sidebar-loading">Loading…</p>
        </nav>
      </div>
    </aside>

    <main class="post-main">
      <div id="post-loading" class="loading-state">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </div>
      <div id="post-error" class="error-state" style="display:none"></div>

      <article id="post-article" style="display:none">
        <header class="post-header">
          <div class="post-header-meta">
            <div id="post-category" class="post-category-breadcrumb"></div>
            <span id="post-date" class="post-date"></span>
          </div>
          <h1 id="post-title" class="post-title"></h1>
        </header>
        <div id="post-body" class="post-body"></div>
        <footer class="post-footer">
          <div class="post-nav" id="post-nav"></div>
          <a href="index.html" class="back-to-all">← Back to all posts</a>
        </footer>
      </article>
    </main>

  </div>

  <footer class="site-footer">
    <p>Written in <a href="https://obsidian.md" target="_blank">Obsidian</a>. Published via <a href="https://pages.github.com" target="_blank">GitHub Pages</a>.</p>
  </footer>

  <script>
    // =========================================================
    // CONFIGURATION — keep in sync with index.html
    // =========================================================
    const VAULT_USER = 'MattHSBY';
    const VAULT_REPO = 'blog-vault';
    // =========================================================

    const IGNORE = new Set(['.obsidian', '.git', 'README.md', 'readme.md']);

    // Query params: path, user, repo — all passed by index.html links
    const params    = new URLSearchParams(window.location.search);
    const filePath  = params.get('path');
    const vaultUser = params.get('user') || VAULT_USER;
    const vaultRepo = params.get('repo') || VAULT_REPO;
    const VAULT_API = `https://api.github.com/repos/${vaultUser}/${vaultRepo}`;

    marked.setOptions({ breaks: true, gfm: true });

    async function fetchAllPosts(path = '') {
      const url = path ? `${VAULT_API}/contents/${path}` : `${VAULT_API}/contents`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      const items = await res.json();
      const posts = [];
      for (const item of items) {
        if (IGNORE.has(item.name)) continue;
        if (item.type === 'dir') posts.push(...await fetchAllPosts(item.path));
        else if (item.type === 'file' && item.name.endsWith('.md')) posts.push(item);
      }
      return posts;
    }

    async function fetchMarkdown(downloadUrl) {
      const res = await fetch(downloadUrl);
      return res.text();
    }

    function extractTitle(raw) {
      const m = raw.match(/^#\s+(.+)/m);
      return m ? m[1] : 'Untitled';
    }

    function extractDate(raw) {
      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      let sawTitle = false;
      for (const line of lines) {
        if (line.startsWith('# ')) { sawTitle = true; continue; }
        if (sawTitle && /^\*[^*]+\*$/.test(line)) return line.replace(/^\*|\*$/g, '');
        if (sawTitle && line) break;
      }
      return null;
    }

    function stripTitleAndDate(raw) {
      const lines = raw.split('\n');
      let i = 0;
      while (i < lines.length && !lines[i].trim()) i++;
      if (lines[i] && lines[i].trim().startsWith('# ')) {
        i++;
        while (i < lines.length && !lines[i].trim()) i++;
        if (lines[i] && /^\*[^*]+\*$/.test(lines[i].trim())) i++;
      }
      return lines.slice(i).join('\n');
    }

    function postUrl(path) {
      return `post.html?path=${encodeURIComponent(path)}&user=${vaultUser}&repo=${vaultRepo}`;
    }

    async function loadPost() {
      if (!filePath) {
        document.getElementById('post-loading').style.display = 'none';
        const err = document.getElementById('post-error');
        err.style.display = 'block';
        err.textContent = 'No post path specified.';
        return;
      }

      try {
        const fileRes = await fetch(`${VAULT_API}/contents/${filePath}`);
        if (!fileRes.ok) throw new Error(`Could not load post (${fileRes.status})`);
        const fileData = await fileRes.json();
        // Decode base64 content returned by GitHub API
        const raw = decodeURIComponent(
          escape(atob(fileData.content.replace(/\n/g, '')))
        );

        const title    = extractTitle(raw);
        const dateStr  = extractDate(raw);
        const body     = stripTitleAndDate(raw);

        document.title = `${title} — Your Name`;

        // Build category breadcrumb from all folder segments in the path
        const parts   = filePath.replace(/\.md$/, '').split('/');
        const folders = parts.slice(0, -1);
        const catEl   = document.getElementById('post-category');
        if (folders.length) {
          catEl.innerHTML = folders.map((f, i) =>
            `${i > 0 ? '<span class="post-category-sep">›</span>' : ''}<span class="post-category">${f}</span>`
          ).join('');
        }

        document.getElementById('post-title').textContent = title;
        if (dateStr) document.getElementById('post-date').textContent = dateStr;
        document.getElementById('post-body').innerHTML = marked.parse(body);

        document.getElementById('post-loading').style.display = 'none';
        document.getElementById('post-article').style.display = 'block';

      } catch (err) {
        document.getElementById('post-loading').style.display = 'none';
        const errEl = document.getElementById('post-error');
        errEl.style.display = 'block';
        errEl.innerHTML = `<strong>Could not load post.</strong><br>${err.message}`;
      }
    }

    async function loadSidebar() {
      const sidebarNav = document.getElementById('sidebar-posts');
      try {
        const files = await fetchAllPosts();
        const posts = await Promise.all(files.map(async f => {
          const raw = await fetchMarkdown(f.download_url);
          return { path: f.path, title: extractTitle(raw), date: extractDate(raw) };
        }));

        posts.sort((a, b) => {
          if (a.date && b.date) return b.date.localeCompare(a.date);
          if (a.date) return -1;
          if (b.date) return 1;
          return a.title.localeCompare(b.title);
        });

        sidebarNav.innerHTML = '';
        const currentPath = decodeURIComponent(filePath || '');

        posts.forEach((p, i) => {
          const isCurrent = p.path === currentPath;
          const a = document.createElement('a');
          a.href = postUrl(p.path);
          a.className = 'sidebar-link' + (isCurrent ? ' active' : '');
          a.textContent = p.title;
          sidebarNav.appendChild(a);

          if (isCurrent) {
            const nav = document.getElementById('post-nav');
            if (posts[i + 1]) {
              const prev = document.createElement('a');
              prev.href = postUrl(posts[i + 1].path);
              prev.className = 'post-nav-link prev';
              prev.innerHTML = `<span>← Previous</span><span class="post-nav-title">${posts[i + 1].title}</span>`;
              nav.appendChild(prev);
            }
            if (posts[i - 1]) {
              const next = document.createElement('a');
              next.href = postUrl(posts[i - 1].path);
              next.className = 'post-nav-link next';
              next.innerHTML = `<span>Next →</span><span class="post-nav-title">${posts[i - 1].title}</span>`;
              nav.appendChild(next);
            }
          }
        });

      } catch {
        sidebarNav.innerHTML = '<p class="sidebar-loading">Could not load.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPost();
      loadSidebar();
    });
  </script>
</body>
</html>
