<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name — Writing</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="home">

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-title">Your Name</a>
      <nav class="site-nav">
        <a href="index.html" class="nav-link active">Writing</a>
        <a href="about.html" class="nav-link">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="hero-label">— a notebook made public</p>
      <h1 class="hero-title">Things I'm<br><em>working on</em></h1>
    </section>

    <section class="posts-section">
      <div id="loading" class="loading-state">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </div>
      <div id="error" class="error-state" style="display:none"></div>
      <div id="posts-grid" class="posts-grid" style="display:none"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Written in <a href="https://obsidian.md" target="_blank">Obsidian</a>. Published via <a href="https://pages.github.com" target="_blank">GitHub Pages</a>.</p>
  </footer>

  <script>
    // =========================================================
    // CONFIGURATION
    // VAULT_USER / VAULT_REPO  → the separate repo your Obsidian
    //                            vault pushes to (all .md files)
    // SITE_USER  / SITE_REPO   → this GitHub Pages repo
    //                            (only needed if you want to link
    //                            back to the source; not used for
    //                            fetching posts)
    // =========================================================
    const VAULT_USER = 'YOUR_GITHUB_USERNAME';
    const VAULT_REPO = 'YOUR_VAULT_REPO_NAME';   // e.g. 'blog-vault'
    // =========================================================

    const VAULT_API = `https://api.github.com/repos/${VAULT_USER}/${VAULT_REPO}`;

    // Files/folders at the vault root to skip (Obsidian internals,
    // README, etc). Add anything you don't want to appear as posts.
    const IGNORE = new Set(['.obsidian', '.git', 'README.md', 'readme.md']);

    // Recursively fetch all .md files from the vault repo root
    async function fetchAllPosts(path = '') {
      const url = path
        ? `${VAULT_API}/contents/${path}`
        : `${VAULT_API}/contents`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(
        `GitHub API ${res.status} — check VAULT_USER and VAULT_REPO in index.html`
      );
      const items = await res.json();

      const posts = [];
      for (const item of items) {
        if (IGNORE.has(item.name)) continue;
        if (item.type === 'dir') {
          posts.push(...await fetchAllPosts(item.path));
        } else if (item.type === 'file' && item.name.endsWith('.md')) {
          posts.push(item);
        }
      }
      return posts;
    }

    async function fetchMarkdown(downloadUrl) {
      const res = await fetch(downloadUrl);
      return res.text();
    }

    function parsePost(raw) {
      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      let title = null, dateStr = null;
      const bodyLines = [];

      for (const line of lines) {
        if (!title && line.startsWith('# ')) {
          title = line.replace(/^#\s+/, '');
        } else if (!dateStr && title && /^\*[^*]+\*$/.test(line)) {
          dateStr = line.replace(/^\*|\*$/g, '');
        } else if (title) {
          bodyLines.push(line);
        }
      }

      const previewRaw = bodyLines.slice(0, 6).join(' ');
      const preview = previewRaw
        .replace(/^#{1,6}\s+/gm, '')
        .replace(/\*\*(.+?)\*\*/g, '$1')
        .replace(/\*(.+?)\*/g, '$1')
        .replace(/`(.+?)`/g, '$1')
        .replace(/\[(.+?)\]\(.+?\)/g, '$1')
        .replace(/^[-*>]\s+/gm, '')
        .trim()
        .slice(0, 220);

      return {
        title: title || 'Untitled',
        dateStr,
        preview: preview + (preview.length === 220 ? '…' : '')
      };
    }

    // post.html reads vault credentials from query params
    function postUrl(filePath) {
      return `post.html?path=${encodeURIComponent(filePath)}&user=${VAULT_USER}&repo=${VAULT_REPO}`;
    }

    function renderCard(filePath, meta) {
      // All folder segments become individual category tags
      const parts = filePath.replace(/\.md$/, '').split('/');
      const folders = parts.slice(0, -1); // everything except the filename
      const categoryHTML = folders.length
        ? folders.map((f, i) =>
            `${i > 0 ? '<span class="card-category-sep">›</span>' : ''}<span class="card-category">${f}</span>`
          ).join('')
        : '';

      const card = document.createElement('article');
      card.className = 'post-card';
      card.innerHTML = `
        <a href="${postUrl(filePath)}" class="card-link">
          <div class="card-meta">
            ${categoryHTML}
            ${meta.dateStr ? `<span class="card-date">${meta.dateStr}</span>` : ''}
          </div>
          <h2 class="card-title">${meta.title}</h2>
          <p class="card-preview">${meta.preview}</p>
          <span class="card-read">Read →</span>
        </a>
      `;
      return card;
    }

    async function init() {
      const loading = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const grid    = document.getElementById('posts-grid');

      try {
        const files = await fetchAllPosts();
        if (files.length === 0) {
          loading.style.display = 'none';
          errorEl.style.display = 'block';
          errorEl.textContent = 'No posts found yet. Push some .md files to your vault repo.';
          return;
        }

        const metas = await Promise.all(
          files.map(f => fetchMarkdown(f.download_url).then(raw => ({
            path: f.path,
            ...parsePost(raw)
          })))
        );

        metas.sort((a, b) => {
          if (a.dateStr && b.dateStr) return b.dateStr.localeCompare(a.dateStr);
          if (a.dateStr) return -1;
          if (b.dateStr) return 1;
          return a.title.localeCompare(b.title);
        });

        loading.style.display = 'none';
        grid.style.display = 'grid';
        metas.forEach(m => grid.appendChild(renderCard(m.path, m)));

      } catch (err) {
        loading.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.innerHTML = `<strong>Could not load posts.</strong><br>${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
